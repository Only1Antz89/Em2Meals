name: CRM follow-up digest

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the idempotent CRM digest
        env:
          CRM_DIGEST_URL: ${{ secrets.CRM_DIGEST_URL }}
          CRM_CRON_SECRET: ${{ secrets.CRM_CRON_SECRET }}
        run: |
          # Skip quietly until the digest is set up, instead of failing every hour.
          if [ -z "$CRM_DIGEST_URL" ] || [ -z "$CRM_CRON_SECRET" ]; then
            echo "::notice::CRM digest skipped: add the CRM_DIGEST_URL and CRM_CRON_SECRET repository secrets to enable it."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRM_CRON_SECRET" \
            "$CRM_DIGEST_URL"
